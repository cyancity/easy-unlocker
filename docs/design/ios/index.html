<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>easy-unlocker · iOS 版设计稿</title>
<link rel="stylesheet" href="screens/screen.css" />
<style>
  body { display: block; overflow: auto; height: auto; background: var(--bg); }
  .page { max-width: 1360px; margin: 0 auto; padding: 56px 32px 72px; }

  .head h1 {
    font-family: var(--font-display);
    font-size: var(--text-2xl); font-weight: 700;
    letter-spacing: var(--tracking-display);
    margin: 0;
  }
  .head .sub { color: var(--muted); font-size: var(--text-base); margin-top: 10px; }
  .head .map { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .head .map span {
    font-family: var(--font-mono); font-size: var(--text-xs);
    color: var(--fg-2);
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-pill);
    padding: 5px 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
    gap: 40px 24px;
    margin-top: 44px;
    justify-items: center;
  }
  .shot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .shot .cap {
    font-family: var(--font-mono); font-size: var(--text-xs);
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .shot .cap strong { color: var(--fg); font-weight: 600; }

  /* ─── iPhone 15 Pro 机框（与 /frames/iphone-15-pro.html 同一套标记） ─── */
  .device {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 56px;
    padding: 12px;
    background:
      linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 0 0 2px #000 inset,
      0 28px 60px -12px rgba(0,0,0,0.45),
      0 8px 20px -8px rgba(0,0,0,0.35);
    isolation: isolate;
  }
  .device::before, .device::after {
    content: '';
    position: absolute;
    width: 3px;
    background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
    top: 100px; bottom: 100px;
    pointer-events: none;
  }
  .device::before { left: -1px; }
  .device::after  { right: -1px; }

  .island {
    position: absolute;
    top: 22px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 36px;
    background: #000; border-radius: 999px;
    z-index: 5;
  }
  .btn-rail { position: absolute; width: 4px; background: #0a0a0c; border-radius: 2px; }
  .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
  .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
  .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
  .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

  .screen {
    position: relative;
    width: 100%; height: 100%;
    background: var(--surface);
    border-radius: 44px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .statusbar {
    flex: 0 0 47px;
    padding: 18px 26px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--fg);
    pointer-events: none;
    position: relative; z-index: 6;
    background: var(--surface);
  }
  .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
  .statusbar svg { width: 17px; height: 11px; fill: currentColor; }
  .statusbar .battery { width: 25px; }

  .inner { flex: 1 1 auto; width: 100%; border: 0; background: var(--surface); }

  .home-indicator {
    flex: 0 0 28px;
    position: relative;
    pointer-events: none;
    background: var(--surface);
  }
  .home-indicator::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--fg);
    border-radius: 999px;
    opacity: 0.85;
  }
</style>
</head>

    <p class="sub">与 Android 版功能逐项对齐，交互与视觉按 Apple 原生设计语言重做。点进任意一台机器即可在标签页间、详情与表单之间实际操作。</p>

      <span>FCM → APNs</span>
      <span>胶囊导航 → 标签栏</span>
      <span>列表 → 分组圆角列表</span>
      <span>操作菜单 → 操作表单</span>
    </div>
  </header>

            </span>
          </div>
          <iframe class="inner" src="screens/vault.html" loading="lazy" title="条目首页"></iframe>
          <div class="home-indicator" aria-hidden></div>
        </div>
      </div>
      <div class="cap"><strong>条目</strong> · Vault / 搜索</div>
    </div>
